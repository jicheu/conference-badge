# Publishes tools/badge_ble.html as the GitHub Pages site (https is required
# by Web Bluetooth on phones). Nothing is built: the page is a single file.
name: Publish badge sender

on:
  push:
    branches: [main]
    paths: [tools/badge_ble.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir site
          cp tools/badge_ble.html site/index.html
          sed -i "s/__BUILD__/$(git rev-parse --short HEAD) $(date -u +'%Y-%m-%d %H:%M') UTC/" site/index.html
          grep -c "UTC" site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
