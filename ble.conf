# Bluetooth LE remote pages. Build with: -DEXTRA_CONF_FILE=ble.conf
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="Badge"
CONFIG_BADGE_BLE=y

# Pairing with the fixed passkey CONFIG_BADGE_BLE_PASSKEY, given by the app_passkey() callback.
CONFIG_BT_SMP=y
CONFIG_BT_APP_PASSKEY=y

# Bigger packets: a full frame is 48 KB.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Long writes (the iPhone sends anything above 20 bytes this way) need prepare buffers:
# 180 bytes in 18-byte pieces = 10, so 16 is enough. Zephyr's default 0 refuses them
# with ATT error 6 "request not supported".
CONFIG_BT_ATT_PREPARE_COUNT=16

# Ask the phone for a bigger ATT packet right after connecting (the iPhone answers 185),
# so that most writes are not long writes at all.
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
